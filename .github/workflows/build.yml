name: Build OpenFlux Core

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CGO_ENABLED: '0'

jobs:
  checks:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Check test runtimes
        run: go version
      - name: Test core
        working-directory: core
        run: go test -timeout 5m -count=1 ./utils/...
      - name: Vet
        working-directory: core
        run: go vet ./...

  build:
    name: Build (${{ matrix.target }})
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - windows-amd64
          - windows-arm64
          - windows-386
          - linux-amd64
          - linux-arm64
          - linux-386
          - linux-armv7
          - darwin-amd64
          - darwin-arm64
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Build binary
        run: sh scripts/build.sh "$TARGET"
      - name: Verify checksum
        shell: bash
        run: |
          suffix=''
          if [[ "$TARGET" == windows-* ]]; then suffix='.exe'; fi
          asset="openflux-$TARGET$suffix"
          cd dist
          test -s "$asset"
          test -s "$asset.sha256"
          sha256sum --check "$asset.sha256"
          if [[ "$TARGET" == linux-amd64 && -s "opensub-$TARGET" ]]; then
            test -s "opensub-$TARGET.sha256"
            sha256sum --check "opensub-$TARGET.sha256"
          fi
      - name: Upload binary and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/openflux-${{ matrix.target }}*
            dist/opensub-${{ matrix.target }}*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release
          merge-multiple: true
      - name: Prepare and verify release files
        run: sh scripts/package-release.sh --skip-build release
      - name: Publish binaries and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" --json isDraft,assets > "$RUNNER_TEMP/openflux-release-info.json" 2>/dev/null; then
            echo "Release $RELEASE_TAG exists, uploading assets..."
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "OpenFlux $RELEASE_TAG" \
              --notes "OpenFlux $RELEASE_TAG release binaries"
          fi
          assets=(release/SHA256SUMS.txt)
          while IFS= read -r target || [[ -n "$target" ]]; do
            target="${target%$'\r'}"
            [[ -n "$target" ]] || continue
            suffix=''
            if [[ "$target" == windows-* ]]; then suffix='.exe'; fi
            asset="release/openflux-$target$suffix"
            assets+=("$asset" "$asset.sha256")
            if [[ -f "release/opensub-$target" ]]; then
              assets+=("release/opensub-$target" "release/opensub-$target.sha256")
            fi
          done < scripts/targets.txt
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${release_flags[@]}"
